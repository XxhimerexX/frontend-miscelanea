<div
  class="app-shell"
  [class.is-collapsed]="layout.sidebarColapsada()"
  [class.is-mobile-open]="layout.sidebarMovilAbierta()">
  <app-sidebar></app-sidebar>

  <div class="app-sidebar__backdrop" (click)="layout.cerrarMovil()"></div>

  <div class="app-main">
    <app-header></app-header>

    <main class="app-content">
      <app-breadcrumbs></app-breadcrumbs>

      <div class="card">
        <div class="card-body">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>
  </div>
</div>
