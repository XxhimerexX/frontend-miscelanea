<section class="login-tedi-wrapper">
  <img [src]="imagenLoginUrl || '../assets/images/logintedi.png'" alt="" class="login-bg" />
  <div class="login-scrim"></div>

  <div class="login-box card">
    <div class="card-body p-4 p-lg-5">
      <div class="text-center mb-4">
        <div class="login-brand-icon"><i class="mdi mdi-storefront"></i></div>
        <h1 class="h4 mt-3 mb-1">{{ nombreApp }}</h1>
        <p class="text-muted small mb-0">Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Paso 1: usuario y contraseña -->
      <form (ngSubmit)="iniciarSesion()" *ngIf="!mostrarSeleccionEmpresa">
        <div class="alert alert-danger py-2" *ngIf="errorMensaje">{{ errorMensaje }}</div>

        <div class="mb-3">
          <label class="form-label" for="loginUsuario">Usuario</label>
          <input
            id="loginUsuario"
            class="form-control form-control-lg"
            type="text"
            [(ngModel)]="usuario"
            name="usuario"
            required
            autocomplete="username"
            autocapitalize="none"
            placeholder="tu.usuario" />
        </div>

        <div class="mb-4">
          <label class="form-label" for="loginContrasena">Contraseña</label>
          <input
            id="loginContrasena"
            class="form-control form-control-lg"
            type="password"
            [(ngModel)]="contrasena"
            name="contrasena"
            required
            autocomplete="current-password"
            placeholder="••••••••" />
        </div>

        <button class="btn btn-primary btn-lg w-100 fw-semibold" type="submit" [disabled]="cargando">
          {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>
      </form>

      <!-- Paso 2: elegir empresa (solo si el usuario pertenece a varias) -->
      <div *ngIf="mostrarSeleccionEmpresa">
        <div class="alert alert-danger py-2" *ngIf="errorMensaje">{{ errorMensaje }}</div>
        <p class="text-muted small mb-3 text-center">Perteneces a varias empresas. Elige con cuál trabajar:</p>

        <div class="d-grid gap-2 mb-3">
          <button
            type="button"
            class="btn btn-outline-primary btn-lg text-start"
            *ngFor="let emp of empresasDisponibles"
            [disabled]="cargando"
            (click)="elegirEmpresa(emp.id)">
            <i class="mdi mdi-domain me-2"></i>{{ emp.nombre }}
          </button>

          <button
            type="button"
            class="btn btn-outline-secondary btn-lg text-start"
            *ngIf="permiteSuperAdmin"
            [disabled]="cargando"
            (click)="elegirModoSuperAdmin()">
            <i class="mdi mdi-shield-crown-outline me-2"></i>Administración de empresas
          </button>
        </div>

        <button type="button" class="btn btn-link w-100" (click)="volverALogin()" [disabled]="cargando">
          ← Volver
        </button>
      </div>
    </div>
  </div>
</section>
