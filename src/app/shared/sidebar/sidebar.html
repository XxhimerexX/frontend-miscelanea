<aside class="app-sidebar">
  <div class="app-sidebar__brand">
    <span class="app-sidebar__brand-icon" *ngIf="!logoUrl"><i class="mdi mdi-storefront"></i></span>
    <img *ngIf="logoUrl" [src]="logoUrl" alt="" class="app-sidebar__brand-logo" />
    <span>{{ nombreMarca || 'Miscelánea POS' }}</span>
  </div>

  <nav class="app-sidebar__nav" *ngIf="!modoSuperAdminSinEmpresa">
    <div class="app-sidebar__section">Menú principal</div>

    <a
      *ngFor="let item of menuVisible"
      [routerLink]="item.Ruta"
      routerLinkActive="active"
      class="app-sidebar__link"
      (click)="layout.cerrarMovil()">
      <i [ngClass]="item.Icono || 'mdi mdi-circle-small'"></i>
      <span class="app-sidebar__link-text">{{ item.Etiqueta }}</span>
    </a>
  </nav>

  <!-- Superadministrador sin empresa activa: solo puede administrar empresas -->
  <nav class="app-sidebar__nav" *ngIf="modoSuperAdminSinEmpresa">
    <div class="app-sidebar__section">Superadministrador</div>
    <a routerLink="/empresas" routerLinkActive="active" class="app-sidebar__link" (click)="layout.cerrarMovil()">
      <i class="mdi mdi-domain"></i>
      <span class="app-sidebar__link-text">Empresas</span>
    </a>
  </nav>

  <div class="app-sidebar__footer">
    <div class="app-sidebar__footer-info d-flex align-items-center justify-content-between mb-2">
      <span class="small text-muted text-truncate">
        {{ authService.obtenerUsuario()?.nombre || 'Usuario' }}
      </span>
      <span
        class="badge flex-shrink-0"
        [ngClass]="cajaAbierta ? 'text-bg-success' : 'text-bg-secondary'">
        {{ cajaAbierta ? 'Abierta' : 'Cerrada' }}
      </span>
    </div>

    <button
      *ngIf="cajaAbierta"
      class="btn btn-outline-danger btn-sm w-100 fw-semibold d-flex align-items-center justify-content-center gap-1"
      [title]="'Cerrar caja'"
      (click)="abrirPanelCierre()">
      <i class="mdi mdi-lock"></i>
      <span class="app-sidebar__link-text">Cerrar caja</span>
    </button>
  </div>
</aside>

<!-- Panel de cierre de caja (overlay) -->
<div
  class="app-modal-overlay"
  *ngIf="mostrarPanelCierre"
  style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1060; display: flex; align-items: center; justify-content: center; padding: 1rem;">
  <div class="card" style="width: 420px; max-width: 100%;">
    <div class="card-body">
      <h5 class="card-title fw-bold"><i class="mdi mdi-lock"></i> Cerrar caja</h5>
      <p class="text-muted small">
        Base inicial del turno: <strong>${{ turnoActual?.BaseInicial | number }}</strong>
      </p>

      <div class="mb-2">
        <label class="form-label small fw-semibold">Total ventas en efectivo (calculado)</label>
        <input
          type="text"
          class="form-control form-control-sm fw-bold"
          [value]="cargandoResumen ? 'Calculando...' : ('$' + (totalEfectivoSistema | number))"
          readonly />
      </div>
      <div class="mb-2">
        <label class="form-label small fw-semibold">Total ventas digitales (calculado)</label>
        <input
          type="text"
          class="form-control form-control-sm fw-bold"
          [value]="cargandoResumen ? 'Calculando...' : ('$' + (totalDigitalSistema | number))"
          readonly />
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Dinero real contado en la gaveta</label>
        <input type="number" class="form-control form-control-sm" [(ngModel)]="montoFinalReal" />
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-secondary btn-sm w-50" (click)="cerrarPanelCierre()">Cancelar</button>
        <button
          class="btn btn-danger btn-sm w-50 fw-semibold"
          (click)="confirmarCierreCaja()"
          [disabled]="cerrandoCaja">
          {{ cerrandoCaja ? 'Cerrando...' : 'Confirmar cierre' }}
        </button>
      </div>
    </div>
  </div>
</div>
