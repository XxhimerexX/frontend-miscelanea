<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Miscelánea POS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Aplica el tema guardado antes del primer render para evitar el "flash" -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('mp-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-bs-theme', t);
        var a = localStorage.getItem('mp-accent') || 'indigo';
        root.setAttribute('data-mp-accent', a);
      } catch (e) {
        root.setAttribute('data-bs-theme', 'light');
        root.setAttribute('data-mp-accent', 'indigo');
      }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
