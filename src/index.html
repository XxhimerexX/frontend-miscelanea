<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Miscelánea POS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- Instalación como app en el celular (Add to Home Screen) -->
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Miscelánea">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Aplica el tema guardado antes del primer render para evitar el "flash" -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('mp-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-bs-theme', t);
        var a = localStorage.getItem('mp-accent') || 'indigo';
        root.setAttribute('data-mp-accent', a);
      } catch (e) {
        root.setAttribute('data-bs-theme', 'light');
        root.setAttribute('data-mp-accent', 'indigo');
      }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
